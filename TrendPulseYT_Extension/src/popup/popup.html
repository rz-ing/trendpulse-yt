<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrendPulse YT - Quick Status</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">📈</div>
        <div>
          <h1 class="brand-title">TrendPulse YT</h1>
          <span class="brand-subtitle">v1.0.0</span>
        </div>
      </div>
      <div class="api-status" id="api-status-badge" title="Estado de la API Key">
        <span class="status-dot dot-red"></span>
        <span class="status-text">Sin API Key</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="popup-main">
      <!-- Active Video Card -->
      <section class="card active-video-card">
        <div class="card-header">
          <span class="card-title">🎥 Video en Pestaña Activa</span>
        </div>
        <div class="card-body" id="active-video-content">
          <p class="text-muted">Detectando pestaña activa...</p>
        </div>
      </section>

      <!-- Quick Metrics Grid -->
      <section class="metrics-grid">
        <div class="metric-card">
          <span class="metric-value" id="stat-total-tracked">0</span>
          <span class="metric-label">Trackeados</span>
        </div>
        <div class="metric-card highlight-card">
          <span class="metric-value flame-text" id="stat-trending-count">0</span>
          <span class="metric-label">🔥 En Tendencia</span>
        </div>
      </section>

      <!-- Quota Meter -->
      <section class="card quota-card">
        <div class="quota-header">
          <span class="quota-title">⚡ Cuota Diaria (YouTube API)</span>
          <span class="quota-value" id="quota-text">0 / 10,000</span>
        </div>
        <div class="quota-bar-bg">
          <div class="quota-bar-fill" id="quota-fill" style="width: 0%;"></div>
        </div>
        <p class="quota-hint">search.list: 100u | videos.list: 1u (batch)</p>
      </section>
    </main>

    <!-- Footer Actions -->
    <footer class="popup-footer">
      <button class="btn btn-primary" id="btn-open-dashboard">
        📊 Abrir Dashboard Completo
      </button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
